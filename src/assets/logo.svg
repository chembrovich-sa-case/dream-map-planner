<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="55%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="logo-horizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="logo-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <style>
    .brand-title { fill: #202124; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
    .brand-subtitle { fill: #0D9488; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8px; letter-spacing: 0.16em; }
    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #FFFFFF; }
      .brand-subtitle { fill: #2DD4BF; }
    }
  </style>

  <!-- Branded Icon Mark (40x40 squircle) -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="11" fill="url(#logo-bg)"/>
    
    <!-- Radar concentric arcs -->
    <path d="M8 23 A12 12 0 0 1 32 23" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
    <path d="M11 23 A9 9 0 0 1 29 23" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M15 23 A5 5 0 0 1 25 23" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Radar beacon sweep -->
    <line x1="20" y1="23" x2="30" y2="13" stroke="#A7F3D0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="30" cy="13" r="2" fill="#34D399"/>

    <!-- Horizon Sun / Core Spark -->
    <circle cx="20" cy="22" r="3.2" fill="url(#logo-sun)"/>

    <!-- Horizon Line -->
    <path d="M6 24.5 L34 24.5" stroke="url(#logo-horizon)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Reflection lines -->
    <path d="M10 28 L30 28" stroke="rgba(255, 255, 255, 0.38)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M14 31 L26 31" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(54, 0)">
    <text x="0" y="27" class="brand-title">ГОРИЗОНТ</text>
    <text x="0.5" y="39" class="brand-subtitle">КАРТА ЖЕЛАНИЙ &amp; БАЛАНС</text>
  </g>
</svg>