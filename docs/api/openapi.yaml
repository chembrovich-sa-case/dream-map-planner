          type: integer
          minimum: 0
          maximum: 100
          description: Новый расчетный процент выполнения цели
        goal_status:
          type: string
          enum: [draft, in_progress, achieved, archived]
        sphere_metrics:
          type: object
          required:
            - sphere_id
            - sphere_title
            - previous_score
            - new_score
            - score_delta
          properties:
            sphere_id:
              type: string
              format: uuid
            sphere_title:
              type: string
            previous_score:
              type: number
              format: float
            new_score:
              type: number
              format: float
            score_delta:
              type: number
              format: float
              description: Изменение балла сферы (+/-)
        celebration:
          type: boolean
          description: Признак достижения 100% цели для триггера анимации конфетти

    RadarSectorDTO:
      type: object
      required:
        - sphere_id
        - title
        - color
        - icon
        - target_score
        - current_score
        - active_goals_count
      properties:
        sphere_id:
          type: string
          format: uuid
        title:
          type: string
        color:
          type: string
        icon:
          type: string
        target_score:
          type: number
          format: float
        current_score:
          type: number
          format: float
        active_goals_count:
          type: integer

    RadarChartResponse:
      type: object
      required:
        - overall_harmony_index
        - evaluated_at
        - sectors
      properties:
        overall_harmony_index:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Индекс гармоничности колеса баланса (от 0.0 до 1.0)
        evaluated_at:
          type: string
          format: date-time
          description: Время вычисления среза
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/RadarSectorDTO'

    SuccessMessageResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string

    DatabaseBackupDTO:
      type: object
      required:
        - version
        - exported_at
        - spheres
        - goals
      properties:
        version:
          type: string
          example: "1.0.0"
          description: Версия формата схемы резервной копии
        exported_at:
          type: string
          format: date-time
          example: "2026-10-24T18:00:00Z"
          description: Дата и время формирования дампа
        spheres:
          type: array
          items:
            $ref: '#/components/schemas/LifeSphereResponse'
          description: Полный список сфер жизни пользователя
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalCardResponse'
          description: Реестр карточек целей со всеми вложенными шагами чек-листов

    ImportResultDTO:
      type: object
      required:
        - success
        - message
        - imported_spheres_count
        - imported_goals_count
        - imported_steps_count
      properties:
        success:
          type: boolean
          example: true
          description: Результат выполнения операции импорта
        message:
          type: string
          example: "База данных успешно восстановлена: импортировано 6 сфер, 6 целей и 20 шагов чек-листа"
          description: Человекочитаемый отчет о результатах импорта
        imported_spheres_count:
          type: integer
          example: 6
          description: Количество загруженных сфер жизни
        imported_goals_count:
          type: integer
          example: 6
          description: Количество загруженных карточек целей
        imported_steps_count:
          type: integer
          example: 20
          description: Количество загруженных шагов чек-листов

    NbrbExchangeRateResponse:
      type: object
      required:
        - currency_code
        - scale
        - rate
        - rate_date
        - source
      properties:
        currency_code:
          type: string
          example: "USD"
          description: Буквенный трехзначный код валюты (ISO 4217)
        scale:
          type: integer
          example: 1
          description: Количество единиц иностранной валюты
        rate:
          type: number
          format: float
          example: 2.9543
          description: Официальный курс НБРБ в белорусских рублях (BYN)
        rate_date:
          type: string
          format: date
          example: "2026-10-25"
          description: Дата установления официального курса
        source:
          type: string
          example: "api.nbrb.by"
          description: Источник данных (НБРБ или локальный суточный кэш)
        cached:
          type: boolean
          example: true
          description: Признак получения курса из суточного кэша
        fetched_at:
          type: string
          format: date-time
          example: "2026-10-25T00:00:00Z"
          description: Время фиксации курса в системе

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки (например, VALIDATION_ERROR, NOT_FOUND)
        message:
          type: string
          description: Человекочитаемое описание ошибки на русском языке
        details:
          type: array
          items:
            type: string
          nullable: true
          description: Дополнительные детали или список невалидных полей

  # ============================================================================
  # СТАНДАРТНЫЕ ОТВЕТЫ ОШИБОК (RESPONSES)
  # ============================================================================
  responses:
    BadRequestError:
      description: Некорректный запрос (ошибка валидации параметров)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "VALIDATION_FAILED"
            message: "Некорректные параметры запроса"
            details:
              - "color: код цвета должен быть валидным HEX в формате #RRGGBB"
              - "title: заголовок цели должен содержать от 3 до 150 символов"

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "Цель с указанным идентификатором не найдена"
            details: []

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "INTERNAL_SERVER_ERROR"
            message: "Произошла непредвиденная ошибка при обработке запроса. Мы уже разбираемся."
            details: []
